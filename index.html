const categories = [

    "音程 (Intervals)", "和弦 (Chords)", "術語、符號與樂器 (Terms, Signs and Instruments)", 
    "綜合分析 (Music in Context)"
];

function initQuiz() {
    const container = document.getElementById('quizContainer');
    let currentIdx = 0;
    
    const countPerCat = [10, 10, 15, 10, 10, 10, 10];
    
    countPerCat.forEach((count, catIdx) => {
        const title = document.createElement('h2');
        title.className = 'category-title';
        title.innerText = categories[catIdx];
        container.appendChild(title);
        
        for(let i=0; i<count; i++) {
            const data = quizData[currentIdx];
            const div = document.createElement('div');
            div.className = 'question-block';
            div.innerHTML = `<div><strong>${currentIdx + 1}. ${data.q}</strong></div>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            data.o.forEach((opt, optIdx) => {
                optionsDiv.innerHTML += `
                    <label class="option">
                        <input type="radio" name="q${currentIdx}" value="${optIdx}"> ${opt}
                    </label>
                `;
            });
            div.appendChild(optionsDiv);
            container.appendChild(div);
            currentIdx++;
        }
    });
}

function checkAnswers() {
    let score = 0;
    quizData.forEach((data, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && parseInt(selected.value) === data.a) {
            score++;
        }
    });
    document.getElementById('result').innerText = `最終得分：${score} / 75`;
}

initQuiz();
