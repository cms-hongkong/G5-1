
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>ABRSM Grade 5 Mock Exam</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; --text: #333; }
        body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .quiz-container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .category-block { margin-top: 40px; border-top: 3px solid var(--primary); padding-top: 15px; }
        .category-title { color: var(--primary); font-size: 22px; margin-bottom: 20px; background: #ecf0f1; padding: 10px; border-radius: 5px; }
        
        .question-item { margin-bottom: 30px; padding: 15px; border-bottom: 1px dashed #ddd; }
        .question-header { font-weight: bold; font-size: 17px; margin-bottom: 10px; color: #2980b9; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .option-label { display: flex; align-items: center; padding: 12px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: 0.2s; background: #fff; }
        .option-label:hover { background: #e1f5fe; border-color: var(--secondary); }
        .option-label input { margin-right: 12px; transform: scale(1.2); }
        
        .submit-section { text-align: center; margin-top: 50px; padding-bottom: 50px; }
        #submitBtn { background: #27ae60; color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #submitBtn:hover { background: #2ecc71; transform: translateY(-2px); }
        #resultDisplay { margin-top: 25px; font-size: 28px; font-weight: bold; color: var(--primary); }
    </style>
</head>

function initQuiz() {
    const quizBody = document.getElementById('quizBody');
    let currentCategory = "";

    quizData.forEach((item, index) => {
        // 如果類別改變，生成類別標題
        if (item.cat !== currentCategory) {
            currentCategory = item.cat;
            const catHeader = document.createElement('div');
            catHeader.className = 'category-block';
            catHeader.innerHTML = `<h2 class="category-title">${currentCategory}</h2>`;
            quizBody.appendChild(catHeader);
        }

        // 生成題目區塊
        const qBlock = document.createElement('div');
        qBlock.className = 'question-item';
        qBlock.innerHTML = `
            <div class="question-header">${item.num} ${item.q}</div>
            <div class="options-grid">
                ${item.o.map((opt, i) => `
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="${i}">
                        ${opt}
                    </label>
                `).join('')}
            </div>
        `;
        quizBody.appendChild(qBlock);
    });
}

function checkAnswers() {
    let score = 0;
    quizData.forEach((data, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && parseInt(selected.value) === data.a) {
            score++;
        }
    });
    document.getElementById('resultDisplay').textContent = score;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

document.getElementById('submitBtn').addEventListener('click', checkAnswers);
