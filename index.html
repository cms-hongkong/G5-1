const container = document.getElementById('quiz-container');
let currentCategory = "";

questions.forEach((q, index) => {
    if (q.cat !== currentCategory) {
        currentCategory = q.cat;
        const header = document.createElement('h3');
        header.className = 'category-header';
        header.innerText = `類別：${currentCategory}`;
        container.appendChild(header);
    }

    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.innerHTML = `<p><strong>Q${q.id}:</strong> ${q.q}</p>`;
    
    const optDiv = document.createElement('div');
    optDiv.className = 'options';
    
    q.options.forEach((opt, optIndex) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => selectOption(index, optIndex, btn);
        optDiv.appendChild(btn);
    });
    
    qDiv.appendChild(optDiv);
    container.appendChild(qDiv);
});

const userAnswers = new Array(questions.length).fill(null);

function selectOption(qIdx, optIdx, btn) {
    userAnswers[qIdx] = optIdx;
    const buttons = btn.parentElement.querySelectorAll('button');
    buttons.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function calculateScore() {
    let score = 0;
    questions.forEach((q, i) => {
        if (userAnswers[i] === q.ans) score++;
    });
    
    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `得分：${score} / 75<br><span style="color: ${score >= 50 ? 'green' : 'red'}">${score >= 50 ? '合格！恭喜你！' : '仍需努力，繼續加油！'}</span>`;
    window.scrollTo(0, document.body.scrollHeight);
}
