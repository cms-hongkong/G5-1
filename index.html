
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABRSM Grade 5 Mock Exam</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; --text: #333; --correct: #27ae60; --wrong: #e74c3c; }
        body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .quiz-container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .category-block { margin-top: 40px; border-top: 3px solid var(--primary); padding-top: 15px; }
        .category-title { color: white; background: var(--primary); padding: 10px 15px; border-radius: 5px; font-size: 20px; margin-bottom: 20px; }
        .question-item { margin-bottom: 40px; padding: 20px; border-radius: 8px; border: 1px solid #eee; transition: 0.3s; }
        .question-item.correct-bg { border: 2px solid var(--correct); background: #f1f9f1; }
        .question-item.wrong-bg { border: 2px solid var(--wrong); background: #fff5f5; }
        .question-header { font-weight: bold; font-size: 17px; margin-bottom: 15px; color: #2980b9; }
        .q-img { display: block; max-width: 100%; height: auto; margin: 15px 0; border: 1px solid #ddd; border-radius: 4px; padding: 5px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-label { display: flex; align-items: center; padding: 12px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; transition: 0.2s; }
        .option-label:hover { background: #f0f7ff; }
        .option-label.selected { border-color: var(--secondary); background: #e1f5fe; border-width: 2px; }
        .option-label input { margin-right: 12px; }
        .status-msg { font-weight: bold; margin-top: 10px; display: none; }
        .correct-text { color: var(--correct); }
        .wrong-text { color: var(--wrong); }
        .warning-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; border: 1px solid #ffeeba; }
        .submit-section { text-align: center; margin-top: 50px; padding-bottom: 100px; }
        #submitBtn { background: #28a745; color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        #submitBtn:hover { background: #218838; transform: scale(1.05); }
        #resultDisplay { margin-top: 25px; font-size: 32px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="warningBox" class="warning-box"></div>
    <div id="quizBody"></div>
    <div class="submit-section">
        <button id="submitBtn">提交答案</button>
        <div id="resultDisplay"></div>
    </div>
</div>

<script>
// 圖片前綴（若在 GitHub 同一資料夾則保持為 ""）
const imgPrefix = ""; 

const quizData = [
    // 1 Rhythm (10題)
    { id: "1-1a", num: "1.1(a)", cat: "1 Rhythm", q: "圈出正確拍號：", o: ["9/8", "3/4", "6/8", "12/8"], a: 0 },
    { id: "1-1b", num: "1.1(b)", cat: "1 Rhythm", q: "圈出正確拍號：", o: ["5/4", "10/8", "3/2", "5/8"], a: 0 },
    { id: "1-1c", num: "1.1(c)", cat: "1 Rhythm", q: "圈出正確拍號：", o: ["7/8", "3/4", "5/8", "9/8"], a: 0 },
    { id: "1-2", num: "1.2", cat: "1 Rhythm", q: "正確重寫為簡單拍子應含：", o: ["三連音符號", "二分音符", "附點四分音符", "四連音"], a: 0 },
    { id: "1-3a", num: "1.3(a)", cat: "1 Rhythm", q: "6/16 拍中，每小節有多少個附點八分音符拍？", o: ["2", "3", "6", "1"], a: 0 },
    { id: "1-3b", num: "1.3(b)", cat: "1 Rhythm", q: "一個倍全音符等於多少個四分音符？", o: ["8", "4", "16", "2"], a: 0 },
    { id: "1-4", num: "1.4", cat: "1 Rhythm", q: "哪一小節的分組 (Grouping) 是正確的？", o: ["正確", "錯誤"], a: 1, type: "binary" },
    { id: "1-5a", num: "1.5(a)", cat: "1 Rhythm", q: "判斷第 1 個方框的休止符是否正確：", o: ["對 (√)", "錯 (X)"], a: 0, type: "binary" },
    { id: "1-5b", num: "1.5(b)", cat: "1 Rhythm", q: "判斷第 2 個方框的休止符是否正確：", o: ["對 (√)", "錯 (X)"], a: 1, type: "binary" },
    { id: "1-5c", num: "1.5(c)", cat: "1 Rhythm", q: "判斷第 3 個方框的休止符是否正確：", o: ["對 (√)", "錯 (X)"], a: 0, type: "binary" },

    // 2 Pitch (10題)
    { id: "2-1", num: "2.1", cat: "2 Pitch", q: "識別顯示的音符名稱：", o: ["F", "G", "A", "B"], a: 0 },
    { id: "2-2", num: "2.2", cat: "2 Pitch", q: "顯示音符的正確同音異名：", o: ["升A", "升B", "降C", "重降C"], a: 0 },
    { id: "2-3k", num: "2.3(調號)", cat: "2 Pitch", q: "判斷移調後的調號是否正確：", o: ["對 (√)", "錯 (X)"], a: 0, type: "binary" },
    { id: "2-3n1", num: "2.3(音1)", cat: "2 Pitch", q: "判斷移調後的第 1 個音符是否正確：", o: ["對 (√)", "錯 (X)"], a: 0, type: "binary" },
    { id: "2-3n2", num: "2.3(音2)", cat: "2 Pitch", q: "判斷移調後的第 2 個音符是否正確：", o: ["對 (√)", "錯 (X)"], a: 1, type: "binary" },
    { id: "2-3n3", num: "2.3(音3)", cat: "2 Pitch", q: "判斷移調後的第 3 個音符是否正確：", o: ["對 (√)", "錯 (X)"], a: 0, type: "binary" },
    { id: "2-3n4", num: "2.3(音4)", cat: "2 Pitch", q: "判斷移調後的第 4 個音符是否正確：", o: ["對 (√)", "錯 (X)"], a: 0, type: "binary" },
    { id: "2-4a", num: "2.4(a)", cat: "2 Pitch", q: "聲明：A 和 B 在同一音高。", o: ["真", "假"], a: 0, type: "binary" },
    { id: "2-4b", num: "2.4(b)", cat: "2 Pitch", q: "聲明：B 比 C 低一個八度。", o: ["真", "假"], a: 1, type: "binary" },
    { id: "2-4c", num: "2.4(c)", cat: "2 Pitch", q: "聲明：C 比 A 高一個八度。", o: ["真", "假"], a: 0, type: "binary" },

    // 3 Keys and Scales (15題)
    { id: "3-1", num: "3.1", cat: "3 Keys & Scales", q: "B 大調正確寫出的調號是：", o: ["5個升號", "4個升號", "3個升號", "6個升號"], a: 0 },
    { id: "3-2", num: "3.2", cat: "3 Keys & Scales", q: "降 E 小調正確寫出的調號是：", o: ["6個降號", "5個降號", "4個降號", "7個降號"], a: 0 },
    { id: "3-3a", num: "3.3(a)", cat: "3 Keys & Scales", q: "此旋律的正確調性為：", o: ["G 小調", "G 大調", "F# 大調", "D 大調"], a: 0 },
    { id: "3-3b", num: "3.3(b)", cat: "3 Keys & Scales", q: "此旋律的正確調性為：", o: ["F# 小調", "D 大調", "B 小調", "A 大調"], a: 0 },
    { id: "3-3c", num: "3.3(c)", cat: "3 Keys & Scales", q: "此旋律的正確調性為：", o: ["G# 小調", "A 大調", "B 大調", "E 大調"], a: 0 },
    { id: "3-4x", num: "3.4(X)", cat: "3 Keys & Scales", q: "完成音階所需，X 位置應填：", o: ["A (還原)", "Ab", "G", "Bb"], a: 0 },
    { id: "3-4y", num: "3.4(Y)", cat: "3 Keys & Scales", q: "完成音階所需，Y 位置應填：", o: ["Gb", "G", "F", "A"], a: 0 },
    { id: "3-5a", num: "3.5(a)", cat: "3 Keys & Scales", q: "選擇譜號使音階成為小調音階：", o: ["低音譜號", "高音譜號", "中音譜號", "次中音譜號"], a: 0 },
    { id: "3-5b", num: "3.5(b)", cat: "3 Keys & Scales", q: "選擇譜號使音階成為小調音階：", o: ["高音譜號", "低音譜號", "中音譜號", "次中音譜號"], a: 0 },
    { id: "3-5c", num: "3.5(c)", cat: "3 Keys & Scales", q: "選擇譜號使音階成為小調音階：", o: ["中音譜號", "高音譜號", "低音譜號", "次中音譜號"], a: 0 },
    { id: "3-6a", num: "3.6(a)", cat: "3 Keys & Scales", q: "聲明：這是 C 開始正確書寫的半音階。", o: ["真", "假"], a: 0, type: "binary" },
    { id: "3-6b", num: "3.6(b)", cat: "3 Keys & Scales", q: "聲明：這是降 E 開始正確書寫的半音階。", o: ["真", "假"], a: 1, type: "binary" },
    { id: "3-7a", num: "3.7(a)", cat: "3 Keys & Scales", q: "此音符是否為 B 大調中的導音？", o: ["是", "否"], a: 0, type: "binary" },
    { id: "3-7b", num: "3.7(b)", cat: "3 Keys & Scales", q: "此音符是否為 A 小調中的下屬音？", o: ["是", "否"], a: 0, type: "binary" },
    { id: "3-7c", num: "3.7(c)", cat: "3 Keys & Scales", q: "此音符是否為升 F 小調中的下中音？", o: ["是", "否"], a: 0, type: "binary" },

    // 4 Intervals (10題)
    { id: "4-1a", num: "4.1(a)", cat: "4 Intervals", q: "命名此音程：", o: ["Major 10th", "Perfect 5th", "Major 3rd", "Minor 10th"], a: 0 },
    { id: "4-1b", num: "4.1(b)", cat: "4 Intervals", q: "命名此音程：", o: ["Augmented 4th", "Diminished 5th", "Perfect 4th", "Major 4th"], a: 0 },
    { id: "4-1c", num: "4.1(c)", cat: "4 Intervals", q: "命名此音程：", o: ["Major 9th", "Compound Minor 2nd", "Major 2nd", "Minor 9th"], a: 0 },
    { id: "4-2a", num: "4.2(a)", cat: "4 Intervals", q: "圈選此音程類型：", o: ["Perfect", "Major", "Minor", "Augmented"], a: 0 },
    { id: "4-2b", num: "4.2(b)", cat: "4 Intervals", q: "圈選此音程類型：", o: ["Minor", "Major", "Perfect", "Augmented"], a: 0 },
    { id: "4-2c", num: "4.2(c)", cat: "4 Intervals", q: "圈選此音程類型：", o: ["Major", "Minor", "Augmented", "Diminished"], a: 0 },
    { id: "4-3a", num: "4.3(a)", cat: "4 Intervals", q: "向上組成 Compound Perfect 5th 是否正確？", o: ["是", "否"], a: 0, type: "binary" },
    { id: "4-3b", num: "4.3(b)", cat: "4 Intervals", q: "向上組成 Minor 7th 是否正確？", o: ["是", "否"], a: 0, type: "binary" },
    { id: "4-3c", num: "4.3(c)", cat: "4 Intervals", q: "向上組成 Augmented 12th 是否正確？", o: ["是", "否"], a: 0, type: "binary" },
    { id: "4-3d", num: "4.3(d)", cat: "4 Intervals", q: "向上組成 Minor 3rd 是否正確？", o: ["是", "否"], a: 0, type: "binary" },

    // 5 Chords (10題)
    { id: "5-1a", num: "5.1(1)", cat: "5 Chords", q: "標記第一個終止和弦音級：", o: ["V", "I", "IV", "II"], a: 0 },
    { id: "5-1b", num: "5.1(2)", cat: "5 Chords", q: "標記第二個終止和弦音級：", o: ["I", "V", "IV", "II"], a: 0 },
    { id: "5-1c", num: "5.1(3)", cat: "5 Chords", q: "標記第三個音級：", o: ["IV", "I", "V", "II"], a: 0 },
    { id: "5-1d", num: "5.1(4)", cat: "5 Chords", q: "標記第四個音級：", o: ["V", "I", "IV", "II"], a: 0 },
    { id: "5-1e", num: "5.1(5)", cat: "5 Chords", q: "標記第五個音級：", o: ["I", "V", "IV", "II"], a: 0 },
    { id: "5-2a", num: "5.2(a)", cat: "5 Chords", q: "命名 D 大調終止式：", o: ["完全終止式", "不完全終止式", "變格終止式"], a: 0 },
    { id: "5-2b", num: "5.2(b)", cat: "5 Chords", q: "命名 F 大調終止式：", o: ["不完全終止式", "完全終止式", "變格終止式"], a: 0 },
    { id: "5-3a", num: "5.3(A)", cat: "5 Chords", q: "C 小調中命名和弦 A：", o: ["Ib", "Va", "Ic", "IVb"], a: 0 },
    { id: "5-3b", num: "5.3(B)", cat: "5 Chords", q: "C 小調中命名和弦 B：", o: ["Vb", "Ic", "IVb", "IVc"], a: 0 },
    { id: "5-3c", num: "5.3(C)", cat: "5 Chords", q: "C 小調中命名和弦 C：", o: ["Va", "Ic", "IIa", "Vb"], a: 0 },

    // 6 Terms, Signs and Instruments (10題)
    { id: "6-1a", num: "6.1(1)", cat: "6 Terms & Instruments", q: "morendo 的意思是：", o: ["漸弱至消失", "雄偉", "愉快", "漸強"], a: 0 },
    { id: "6-1b", num: "6.1(2)", cat: "6 Terms & Instruments", q: "largamente 的意思是：", o: ["寬廣地", "相對緩慢", "活潑", "冷靜"], a: 0 },
    { id: "6-1c", num: "6.1(3)", cat: "6 Terms & Instruments", q: "mesto 的意思是：", o: ["悲傷地", "具表現力", "激動", "急促"], a: 0 },
    { id: "6-2a", num: "6.2(a)", cat: "6 Terms & Instruments", q: "標記為括號的裝飾音是：", o: ["迴音", "倚音", "顫音", "上波音"], a: 0 },
    { id: "6-2b", num: "6.2(b)", cat: "6 Terms & Instruments", q: "標記為括號的裝飾音是：", o: ["倚音", "上迴音", "顫音", "下波音"], a: 0 },
    { id: "6-3a", num: "6.3(a)", cat: "6 Terms & Instruments", q: "聲明：長笛通常演奏音高高於巴松管。", o: ["真", "假"], a: 0, type: "binary" },
    { id: "6-3b", num: "6.3(b)", cat: "6 Terms & Instruments", q: "聲明：小號是一種木管樂器。", o: ["真", "假"], a: 1, type: "binary" },
    { id: "6-3c", num: "6.3(c)", cat: "6 Terms & Instruments", q: "聲明：鈸發出有固定音高的聲音。", o: ["真", "假"], a: 1, type: "binary" },
    { id: "6-3d", num: "6.3(d)", cat: "6 Terms & Instruments", q: "聲明：圓號使用雙簧片。", o: ["真", "假"], a: 1, type: "binary" },
    { id: "6-3e", num: "6.3(e)", cat: "6 Terms & Instruments", q: "聲明：女中音音域低於女高音。", o: ["真", "假"], a: 0, type: "binary" },

    // 7 Music in Context (10題)
    { id: "7-1", num: "7.1", cat: "7 Music in Context", q: "正確寫成低一個八度的是：", o: ["只有 A 和 B", "只有 A", "只有 B 和 C", "A, B 和 C"], a: 0 },
    { id: "7-2a", num: "7.2(a)", cat: "7 Music in Context", q: "聲明：音樂開始應輕輕演奏。", o: ["真", "假"], a: 0, type: "binary" },
    { id: "7-2b", num: "7.2(b)", cat: "7 Music in Context", q: "聲明：音樂以升 F 小調下屬和弦結束。", o: ["真", "假"], a: 1, type: "binary" },
    { id: "7-2c", num: "7.2(c)", cat: "7 Music in Context", q: "聲明：第 7 小節左手最大旋律音程是大三度。", o: ["真", "假"], a: 1, type: "binary" },

    { id: "7-4", num: "7.4", cat: "7 Music in Context", q: "升 F 小調中音音符在左手出現多少次？", o: ["6次", "4次", "5次", "8次"], a: 0 },
    { id: "7-5a", num: "7.5(a)", cat: "7 Music in Context", q: "第 3 小節的節奏與哪一小節相同？", o: ["第 1 小節", "第 2 小節", "第 4 小節", "第 5 小節"], a: 0 },
    { id: "7-5b", num: "7.5(b)", cat: "7 Music in Context", q: "哪一小節出現了 diminuendo？", o: ["第 6 小節", "第 2 小節", "第 4 小節", "第 8 小節"], a: 0 }
];

let submitAttempts = 0;

function initQuiz() {
    const quizBody = document.getElementById('quizBody');
    let currentCat = "";

    quizData.forEach((item, index) => {
        // 分類標題
        if (item.cat !== currentCat) {
            currentCat = item.cat;
            const h = document.createElement('div');
            h.className = 'category-block';
            h.innerHTML = `<h2 class="category-title">${currentCat}</h2>`;
            quizBody.appendChild(h);
        }

        const qBlock = document.createElement('div');
        qBlock.className = 'question-item';
        qBlock.id = `qBlock-${index}`;

        // 選項處理
        const displayOptions = item.type === "binary" ? item.o.slice(0, 2) : item.o;

        qBlock.innerHTML = `
            <div class="question-header">${item.num} ${item.q}</div>
            <img src="${imgPrefix}${item.id}.png" class="q-img" alt="圖片未能顯示" onerror="this.style.display='none'; this.after(' [圖片未能顯示] ');">
            <div class="options-grid">
                ${displayOptions.map((opt, i) => `
                    <label class="option-label" id="label-${index}-${i}">
                        <input type="radio" name="q${index}" value="${i}" onchange="markSelected(${index}, ${i})">
                        ${opt}
                    </label>
                `).join('')}
            </div>
            <div class="status-msg" id="status-${index}"></div>
        `;
        quizBody.appendChild(qBlock);
    });
}

function markSelected(qIdx, optIdx) {
    const labels = document.querySelectorAll(`label[id^="label-${qIdx}-"]`);
    labels.forEach(l => l.classList.remove('selected'));
    document.getElementById(`label-${qIdx}-${optIdx}`).classList.add('selected');
}

function checkAnswers() {
    const warningBox = document.getElementById('warningBox');
    const unfinished = [];
    
    quizData.forEach((_, i) => {
        if (!document.querySelector(`input[name="q${i}"]:checked`)) {
            unfinished.push(quizData[i].num);
        }
    });

    if (unfinished.length > 0 && submitAttempts === 0) {
        warningBox.style.display = 'block';
        warningBox.innerHTML = `<strong>提示：</strong> 以下題目尚未完成：${unfinished.join(', ')}。<br>若確認要提交，請再次按下「提交答案」。`;
        submitAttempts++;
        window.scrollTo(0, 0);
        return;
    }

    warningBox.style.display = 'none';
    let score = 0;
    
    quizData.forEach((item, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const qBlock = document.getElementById(`qBlock-${i}`);
        const statusMsg = document.getElementById(`status-${i}`);
        const userAns = selected ? parseInt(selected.value) : -1;

        statusMsg.style.display = 'block';
        if (userAns === item.a) {
            score++;
            qBlock.classList.add('correct-bg');
            statusMsg.innerHTML = `<span class="correct-text">✓ 正確</span>`;
        } else {
            qBlock.classList.add('wrong-bg');
            statusMsg.innerHTML = `<span class="wrong-text">✗ 錯誤 (正確答案：${item.o[item.a]})</span>`;
        }
        
        const inputs = document.getElementsByName(`q${i}`);
        inputs.forEach(input => input.disabled = true);
    });

    document.getElementById('resultDisplay').innerText = `最終得分：${score} / ${quizData.length}`;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').style.opacity = "0.5";
}

document.getElementById('submitBtn').addEventListener('click', checkAnswers);
initQuiz();
</script>

</body>
</html>
